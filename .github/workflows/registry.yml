name: Registry

on:
  pull_request:
    paths:
      - "registry/**"
      - "scripts/check-registry.ts"
      - "src/core/registry.ts"
      - "src/core/sources/**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run registry:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
