name: Registry

on:
  pull_request:
    paths:
      - "registry/**"
      - "scripts/check-registry.ts"
      - "src/core/registry.ts"
      - "src/core/sources/**"
  # Daily, since authors keep adding builds for new flavors; the run only opens a PR on changes.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run registry:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Puts what the sources install today into the registry and opens (or refreshes) one PR with it.
  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: registry-update
      cancel-in-progress: false
    env:
      BRANCH: registry/update
      TITLE: "chore(registry): update flavors and folders from the sources"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - id: check
        name: Check the registry and write what was found
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          bun run registry:check --write --report "$RUNNER_TEMP/report.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: Open or update the pull request
        run: |
          if git diff --quiet -- registry/addons.toml; then
            echo "No entry changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -q -m "$TITLE" -- registry/addons.toml
          git push --force origin "$BRANCH"
          {
            echo "The scheduled registry check found entries that no longer match what their sources install, and updated them to what installs today."
            echo
            cat "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Fail when an entry needs a person
        if: steps.check.outputs.status != '0'
        run: |
          cat "$RUNNER_TEMP/report.md"
          exit 1
