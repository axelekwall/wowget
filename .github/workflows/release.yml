name: Release

on:
  # A tag pushed by hand releases that tag.
  push:
    tags: ["v*"]
  # The release-on-merge workflow passes a new tag, created at the calling commit with the release.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Every target's OpenTUI native package, not only the runner's, so each binary can embed its own.
      - run: bun install --frozen-lockfile --os='*' --cpu='*' --libc='*'
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:release
        env:
          WOWGET_VERSION: ${{ env.TAG }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ inputs.tag }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          # A pushed tag must already exist; a new one is created at the commit that was built.
          where="--verify-tag"
          if [ -n "$NEW_TAG" ]; then where="--target $GITHUB_SHA"; fi
          gh release create "$TAG" dist/release/* \
            $where --title "$TAG" --generate-notes $prerelease

  # Installs the published binaries with the install scripts on every platform.
  # The assets are served from a local HTTP server so this also works while
  # the repository is private.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      WOWGET_DOWNLOAD_BASE: http://127.0.0.1:8765
      WOWGET_INSTALL_DIR: ${{ github.workspace }}/wowget-bin
    steps:
      - uses: actions/checkout@v4
      - name: Download the release assets and serve them locally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          ls -l assets
          cd assets
          (python3 -m http.server 8765 --bind 127.0.0.1 || python -m http.server 8765 --bind 127.0.0.1) > /dev/null 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:8765/SHA256SUMS.txt
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh
          out="$("$WOWGET_INSTALL_DIR/wowget" --version)"
          echo "$out"
          test "$out" = "wowget ${TAG#v}"
          "$WOWGET_INSTALL_DIR/wowget" tui --check
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1
          $out = & "$env:WOWGET_INSTALL_DIR\wowget.exe" --version
          Write-Host $out
          $expected = "wowget " + ($env:TAG -replace '^v', '')
          if ($out -ne $expected) { throw "expected '$expected', got '$out'" }
          & "$env:WOWGET_INSTALL_DIR\wowget.exe" tui --check
          if ($LASTEXITCODE -ne 0) { throw "tui --check failed" }
